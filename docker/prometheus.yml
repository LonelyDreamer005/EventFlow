global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'eventflow-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
        labels:
          app: 'eventflow-backend'
          env: 'docker-compose'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
