# =============================================================================
# EventFlow — Docker Compose Multi-Container Orchestration
# Services:
#   1. db        - PostgreSQL 15 Database with persistent storage
#   2. backend   - Flask REST API + Gunicorn WSGI Server (port 5000)
#   3. frontend  - React 18 SPA + Nginx Reverse Proxy (port 80)
# =============================================================================

services:
  # ── 1. Database Tier ────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: eventflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
      POSTGRES_USER: ${POSTGRES_USER:-eventflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventflow_user} -d ${POSTGRES_DB:-eventflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - eventflow-network

  # ── 2. Backend Application Tier ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-eventflow}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eventflow-network

  # ── 3. Frontend Web & Proxy Tier ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - eventflow-network

# ── Storage & Networking ──────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: eventflow_postgres_data

networks:
  eventflow-network:
    name: eventflow_network
    driver: bridge
